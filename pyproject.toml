[project]
name = "pdfeditor"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pypdf>=6.20.1",
]

[project.scripts]
pdfeditor = "pdfeditor:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
